identity:
  author: acedatacloud
  name: ace_media
  label:
    en_US: Ace Media and Tools
    zh_Hans: Ace 媒体与工具
  description:
    en_US: One Ace Data Cloud provider for image, video, music, speech, face transformation
      and search tools.
    zh_Hans: 用一个 Ace Data Cloud 供应商使用图片、视频、音乐、语音、面部处理与搜索工具。
  icon: icon.png
  tags:
  - image
  - videos
  - entertainment
credentials_for_provider:
  acedata_bearer_token:
    type: secret-input
    required: true
    label:
      en_US: Ace Data Cloud General application API key
      zh_Hans: Ace Data Cloud 通用应用 API Key
    placeholder:
      en_US: Paste the raw API token without Bearer
      zh_Hans: 粘贴原始 API Token，不加 Bearer
    help:
      en_US: Use a General application key with access to the selected services and
        the read-only model catalog.
      zh_Hans: 使用具有所选服务和只读模型目录权限的通用应用 Key。
    url: https://platform.acedata.cloud/console/applications?utm_source=dify&utm_medium=referral&utm_campaign=evergreen
