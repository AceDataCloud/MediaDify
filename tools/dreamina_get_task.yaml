identity:
  name: dreamina_get_task
  author: acedatacloud
  label:
    en_US: Dreamina OmniHuman 1.5 Get Task
    zh_Hans: Dreamina OmniHuman 1.5 Get Task
description:
  human:
    en_US: Dreamina OmniHuman 1.5 Get Task through the published Ace Data Cloud API.
      Preserve the returned task ID and query the same service until completion.
    zh_Hans: Dreamina OmniHuman 1.5 Get Task through the published Ace Data Cloud
      API. Preserve the returned task ID and query the same service until completion.
  llm: Dreamina OmniHuman 1.5 Get Task through the published Ace Data Cloud API. Preserve
    the returned task ID and query the same service until completion.
parameters:
- name: task_id
  type: string
  required: false
  form: llm
  label:
    en_US: Task id
    zh_Hans: 任务 ID
  human_description:
    en_US: The original task ID from this service.
    zh_Hans: The original task ID from this service.
  llm_description: The original task ID from this service.
- name: trace_id
  type: string
  required: false
  form: llm
  label:
    en_US: Trace id
    zh_Hans: 追踪 ID
  human_description:
    en_US: The tracking ID of the task to be queried (i.e., the trace_id returned
      when creating the video) can be used instead of the id.
    zh_Hans: The tracking ID of the task to be queried (i.e., the trace_id returned
      when creating the video) can be used instead of the id.
  llm_description: The tracking ID of the task to be queried (i.e., the trace_id returned
    when creating the video) can be used instead of the id.
- name: wait_seconds
  type: number
  required: false
  form: llm
  label:
    en_US: Wait seconds
    zh_Hans: 最长等待秒数
  human_description:
    en_US: Optional bounded polling wait, 0 to 240 seconds. Does not resubmit creation.
    zh_Hans: Optional bounded polling wait, 0 to 240 seconds. Does not resubmit creation.
  llm_description: Optional bounded polling wait, 0 to 240 seconds. Does not resubmit
    creation.
  default: 0
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/dreamina_get_task.py
