identity:
  name: digitalhuman_clone_voice
  author: acedatacloud
  label:
    en_US: Digital Human Clone Authorized Voice
    zh_Hans: Digital Human Clone Authorized Voice
description:
  human:
    en_US: Digital Human Clone Authorized Voice through the published Ace Data Cloud
      API. Preserve the returned task ID and query the same service until completion.
    zh_Hans: Digital Human Clone Authorized Voice through the published Ace Data Cloud
      API. Preserve the returned task ID and query the same service until completion.
  llm: Digital Human Clone Authorized Voice through the published Ace Data Cloud API.
    Preserve the returned task ID and query the same service until completion.
parameters:
- name: lang
  type: select
  required: false
  form: llm
  label:
    en_US: Lang
    zh_Hans: 语言
  human_description:
    en_US: Lang for the selected operation.
    zh_Hans: Lang for the selected operation.
  llm_description: Lang for the selected operation.
  options:
  - value: zh
    label:
      en_US: zh
      zh_Hans: zh
