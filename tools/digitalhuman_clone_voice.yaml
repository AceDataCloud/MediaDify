  type: string
  required: false
  form: llm
  label:
    en_US: Name
    zh_Hans: 名称
  human_description:
    en_US: Optional label.
    zh_Hans: Optional label.
  llm_description: Optional label.
- name: audio_url
  type: string
  required: true
  form: llm
  label:
    en_US: Audio url
    zh_Hans: 音频 URL
  human_description:
    en_US: Public URL of a clean 10-20s voice sample.
    zh_Hans: Public URL of a clean 10-20s voice sample.
  llm_description: Public URL of a clean 10-20s voice sample.
output_schema:
  type: object
  properties:
    status:
      type: string
